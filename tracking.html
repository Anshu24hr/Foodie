<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Foodie | Track Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header
      class="bg-white border-b sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm"
    >
      <a href="index.html" class="text-2xl font-bold text-orange-500"
        >🍽️ Foodie</a
      >
      <nav class="flex gap-6 font-medium">
        <a href="index.html" class="hover:text-orange-500">Home</a>
        <a href="menu.html" class="hover:text-orange-500">Menu</a>
        <a href="tracking.html" class="text-orange-500 font-semibold"
          >Track Order</a
        >
      </nav>
      <a
        href="cart.html"
        class="bg-orange-500 text-white px-4 py-2 rounded-full font-semibold hover:bg-orange-600 transition"
        >🛒 Cart
        <span class="bg-white text-orange-500 px-2 py-0.5 rounded-full text-xs"
          >0</span
        ></a
      >
    </header>
    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
      <div class="text-center mb-10">
        <p class="text-orange-500 font-bold text-sm tracking-wide">
          ORDER TRACKING
        </p>
        <h1 class="text-4xl font-extrabold text-gray-900 mt-1">
          Track Your Food 🍽️
        </h1>
        <p class="text-gray-600">Enter your Order ID and Table Number.</p>
      </div>
      <div
        class="bg-white p-6 rounded-xl border shadow-sm max-w-lg mx-auto space-y-4 mb-8"
      >
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Order ID</label
          >
          <input
            type="text"
            placeholder="Example: FD123456"
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Table Number</label
          >
          <input
            type="number"
            placeholder="Example: 12"
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm"
          />
        </div>
        <button
          type="button"
          class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 transition shadow-md"
        >
          Track Order
        </button>
      </div>
      <div
        class="bg-white p-8 rounded-xl border shadow-sm max-w-lg mx-auto text-center"
      >
        <div class="text-4xl mb-2">🔎</div>
        <h3 class="text-lg font-bold text-gray-800">
          Enter your order details
        </h3>
        <p class="text-gray-500 text-sm mt-1">
          Your current order status will appear here.
        </p>
      </div>
    </main>
    <footer
      class="bg-white border-t py-8 text-center text-gray-500 text-sm space-y-2 mt-auto"
    >
      <div class="text-xl font-bold text-orange-500">🍽️ Foodie</div>
      <p>Fresh food. Easy ordering. Happy customers.</p>
    </footer>
  </body>
</html>
